name: desktop

# 비공개 저장소에서는 macOS 러너가 무료 사용 시간을 10배로 쓴다(Windows 2배, Linux 1배).
# 그래서 main에 푸시할 때는 가벼운 Linux 점검(check)만 돌리고,
# 맥·윈도우 설치 파일(package)은 release 브랜치에 푸시하거나 Actions 화면에서 직접 실행할 때만 만든다.
#   새 설치 파일이 필요할 때: git push origin main:release
on:
  push:
    branches: [main, release]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.superpowers/**'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

  package:
    if: github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      - run: yarn dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # 설치본 파일 배치 확인 + 가짜 팀으로 Electron 실행 스모크(실제 Claude 호출 없음)
      - run: yarn workspace @rauha/desktop smoke:dist
      - uses: actions/upload-artifact@v7
        with:
          name: rauha-desktop-${{ runner.os }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-shot-${{ runner.os }}
          path: ${{ runner.temp }}/rauha-smoke.png
          if-no-files-found: ignore
          retention-days: 14
