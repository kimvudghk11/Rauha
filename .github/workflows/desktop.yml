name: desktop

on:
  push:
    branches: [main]
    # v로 시작하는 태그(예: v0.1.0)를 푸시하면 설치 파일을 만들어 GitHub Releases에 올린다.
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.superpowers/**'
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test
        # 평소 3분 안팎. 멈추면 작업 전체(40분)를 다 쓰지 않고 일찍 실패한다.
        timeout-minutes: 15
      - run: yarn build
      - run: yarn dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # 맥 서명·공증: 아래 다섯 비밀이 모두 등록돼 있을 때만 켜진다(scripts/signing.mjs). 하나라도 없으면 지금처럼 ad-hoc.
          # 값은 GitHub Secrets 이름만 쓴다. 등록 방법은 docs/release-checklist.md.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      # 설치본 파일 배치 확인 + 가짜 팀으로 Electron 실행 스모크(실제 Claude 호출 없음)
      - run: yarn workspace @rauha/desktop smoke:dist
      # 설치본(asar)에서 TS 언어 도구·전체 찾기·SQLite·이미지 첨부·docker 안내가 실제로 도는지 확인(가짜 팀, 임시 홈)
      - run: yarn workspace @rauha/desktop smoke:features
      - uses: actions/upload-artifact@v7
        with:
          name: rauha-desktop-${{ runner.os }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-shot-${{ runner.os }}
          path: ${{ runner.temp }}/rauha-smoke.png
          if-no-files-found: ignore
          retention-days: 14

  # v* 태그일 때만: 맥(.dmg 둘)과 윈도우(.exe) 설치 파일을 Releases에 올린다.
  # README의 내려받기 링크(…/releases/latest)가 로그인 없이 이 파일들을 가리킨다.
  release:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: rauha-desktop-*
          merge-multiple: true
          path: dist
      - run: ls -lh dist
      - name: GitHub Release 만들기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*-Setup-*.exe \
            --title "rauha $GITHUB_REF_NAME" \
            --prerelease \
            --notes "rauha 데스크톱 앱 설치 파일입니다. 서명이 없어서 처음 열 때 한 번 허용해야 합니다. 설치 방법은 README의 '데스크톱 앱 설치'를 보세요. macOS는 arm64가 Apple 칩, x64가 인텔 맥입니다."
